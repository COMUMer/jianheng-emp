# Spring Boot 基础配置，每次启动时加载。激活 profile 后，同名设置可由对应 YAML 覆盖。
spring:
  # 应用名称，用于启动日志等标识。
  application:
    name: jh-emp
  # 连接 MySQL 的值由运行环境提供。本地填写仓库根目录的 .env.dev。
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  session:
    jdbc:
      # 会话表由 Flyway 迁移统一创建。
      initialize-schema: never
  servlet:
    # 限制附件上传大小，分别限制单个文件和整次请求。
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB

logging:
  # 所有后端日志写同一个文件；路径由 EMP_LOG_DIR 指定。
  file:
    name: ${EMP_LOG_DIR:./data/logs}/backend.log
  structured:
    format:
      file: ecs
    ecs:
      service:
        name: jh-emp
        environment: ${spring.profiles.active:default}
  logback:
    rollingpolicy:
      max-file-size: ${EMP_LOG_MAX_FILE_SIZE:100MB}
      max-history: ${EMP_LOG_MAX_HISTORY_DAYS:60}
      total-size-cap: ${EMP_LOG_TOTAL_SIZE_CAP:10GB}
      file-name-pattern: ${EMP_LOG_DIR:./data/logs}/backend.%d{yyyy-MM-dd}.%i.log.gz
  level:
    root: ${EMP_LOG_LEVEL:INFO}

mybatis-plus:
  configuration:
    # 把 SQL 列名 employee_id 映射到 Java 属性 employeeId。
    map-underscore-to-camel-case: true
    # 按构造参数名映射查询结果，供 Java record 等类型使用。
    arg-name-based-constructor-auto-mapping: true

springdoc:
  api-docs:
    # 默认关闭 OpenAPI 描述。dev profile 可按 OPENAPI_ENABLED 启用。
    enabled: false
    # OpenAPI 启用后的访问路径，供前端生成接口类型。
    path: /api/openapi

management:
  endpoints:
    web:
      base-path: /api
      # 隐藏 Actuator 的端点索引页。
      discovery:
        enabled: false
      # 对 HTTP 仅开放健康检查，地址为 /api/health。
      exposure:
        include: health
  endpoint:
    health:
      # 健康检查只返回状态等概要，隐藏数据库等组件细节。
      show-details: never

server:
  tomcat:
    # 让超限请求体可被读完并返回 413，而不是直接断开连接。
    max-swallow-size: 52MB
  servlet:
    session:
      cookie:
        # 浏览器脚本无法直接读取会话 Cookie。
        http-only: true
        # 限制跨站请求携带会话 Cookie。
        same-site: lax

mail:
  # Resend 发信密钥；发件人在系统设置的邮件设置中配置，未配置时 dev 把验证码打印到日志。
  resend-key: ${RESEND_API_KEY:}
