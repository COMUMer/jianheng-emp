# 后端：测试与迁移、构建镜像、发布到生产主机。
name: Backend

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

# 发布串行执行，同一时间只允许一个。
concurrency:
  group: backend-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: 测试与迁移
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jh_emp_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: 执行测试
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          SERVER_ADDRESS: 127.0.0.1
          OPENAPI_ENABLED: 'false'
          DB_URL: jdbc:mysql://127.0.0.1:3306/jh_emp_ci
          DB_USER: root
          DB_PASSWORD: root
          EMP_ADMIN_USER: ci-admin
          EMP_ADMIN_PASSWORD: ci-password-123
          # 敏感字段密钥，CI 用固定占位值，不接触生产数据。
          PII_KEYS: v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: ./mvnw -B verify

  image:
    name: 构建镜像
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 计算标签
        id: meta
        run: echo "tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          # GHCR 路径必须全小写，仓库属主含大写字母，这里写死小写形式。
          tags: |
            ghcr.io/comumer/jianheng-emp-server:${{ steps.meta.outputs.tag }}
            ghcr.io/comumer/jianheng-emp-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 发布到主机
    needs: image
    runs-on: ubuntu-latest
    # 首次发布要下载约 350MB 镜像，4.7 Mbps 下需要十几分钟，留足余量。
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: 准备 SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          # 从 Windows 复制的内容可能带 CRLF，SSH 会把它当成密钥内容的一部分。
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: 上传部署文件
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          scp -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            deploy/compose.yaml deploy/deploy.sh "$SSH_USER@$SSH_HOST:/opt/jh-emp/"

      - name: 写入配置
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          ENV_PROD: ${{ secrets.ENV_PROD }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          printf '%s\n' "$ENV_FILE" | tr -d '\r' | ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" 'install -m 600 /dev/stdin /opt/jh-emp/.env'
          printf '%s\n' "$ENV_PROD" | tr -d '\r' | ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" 'install -m 600 /dev/stdin /opt/jh-emp/.env.prod'

      - name: 执行发布
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "cd /opt/jh-emp && bash deploy.sh sha-${GITHUB_SHA:0:7}"
